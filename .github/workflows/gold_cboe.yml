name: Gold CBOE data fetch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'   # 09:00 BRT (UTC 12)
    - cron: '0 15 * * 1-5'   # 12:00 BRT
    - cron: '0 18 * * 1-5'   # 15:00 BRT
    - cron: '0 21 * * 1-5'   # 18:00 BRT

jobs:
  fetch-gold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run gold CBOE script
        run: python scripts/gold_cboe.py

      - name: Commit and push JSON files
        env:
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: github-actions@github.com
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: github-actions@github.com
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add api/dados/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza dados de ouro $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin main
          fi
